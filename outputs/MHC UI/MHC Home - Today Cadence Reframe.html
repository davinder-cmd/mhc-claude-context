// ─────────────────────────────────────────────────────────────
// Atoms
// ─────────────────────────────────────────────────────────────
function Sparkline({ values, color = MHC.blue, width = 100, height = 26, highlightLast = false }) {
  const max = Math.max(...values);
  const min = Math.min(...values);
  const range = (max - min) || 1;
  const stepX = width / (values.length - 1);
  const points = values.map((v, i) => {
    const x = i * stepX;
    const y = height - ((v - min) / range) * (height - 4) - 2;
    return [x, y];
  });
  const path = points.map(([x, y], i) => `${i === 0 ? 'M' : 'L'} ${x.toFixed(1)} ${y.toFixed(1)}`).join(' ');
  return (
    <svg width={width} height={height} style={{ display:'block' }}>
      <path d={path} fill="none" stroke={color} strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"/>
      {highlightLast && (
        <circle cx={points[points.length-1][0]} cy={points[points.length-1][1]} r={3} fill={color}/>
      )}
    </svg>
  );
}

function MiniBars({ values, target, color = MHC.blue, width = 100, height = 26, todayIndex = -1 }) {
  // 7 small bars; "today" rendered fainter or differently
  const max = Math.max(target, ...values);
  const barWidth = (width - (values.length - 1) * 2) / values.length;
  return (
    <svg width={width} height={height} style={{ display:'block' }}>
      {values.map((v, i) => {
        const h = (v / max) * (height - 2);
        const x = i * (barWidth + 2);
        const y = height - h;
        const isToday = i === todayIndex;
        return (
          <rect
            key={i}
            x={x}
            y={y}
            width={barWidth}
            height={Math.max(2, h)}
            rx={1.5}
            fill={color}
            opacity={isToday ? 0.4 : 1}
          />
        );
      })}
    </svg>
  );
}

    <div style={{
      width: 358, padding: 18, background:'#fff', borderRadius: 22,

        ↑ Greeting · Hero · Programs rail
      </div>
      {children}
      <div style={{ borderTop:`1px dashed ${MHC.divider}`, paddingTop: 12, marginTop: 14, fontFamily:"'Raleway',sans-serif", fontSize: 11, color: MHC.slate, letterSpacing: 0.5, textTransform:'uppercase', fontWeight: 700 }}>
        ↓ Insights · For your focus
      </div>
    </div>
  );
}
function Callout({ children }) { return <div className="callout">{children}</div>; }

// ─────────────────────────────────────────────────────────────
// APP
// ─────────────────────────────────────────────────────────────
function App() {
  return (
    <div>
      <DesignCanvas>

        {/* ── INTRO ─────────────────────────────────────────── */}
        <DCSection
          id="intro"
          title="Today section — reframe to weekly so partial sync is invisible"
          subtitle="Stop telling users what 'today' looks like. Show data at a cadence where partial syncs and missing chunks don't read as gaps. Personify and similar vendors do this for the same reason — it makes their numbers durable.">

          <DCArtboard id="problem" label="The reframe" width={580} height={580}>
            <div style={{ padding: 28, height:'100%', boxSizing:'border-box', display:'flex', flexDirection:'column', gap: 16 }}>
              <div className="hero-card">
                <h3>Reframe</h3>
                <h2>Hide the lag by changing what's being measured.</h2>
                <p>"Today" implies <i>now</i>. When sync is delayed or partial, "now" exposes the seams: an 8,572-step day that's actually 11,400 looks like the user fell short. We can't fix the sync timing, but we can stop asking the page to show a value that depends on it.</p>
                <p>Move the framing to a window where partial data is statistically invisible. Weekly totals smooth out missing hours. 7-day rolling averages absorb a 5-hour gap without the user noticing.</p>
                <p style={{marginTop: 12}}>The user still sees their numbers — they're just <b style={{color:'#fff'}}>at a cadence we can support</b>.</p>
              </div>
              <Callout>
                <b>What we get.</b> No "may be behind" copy. No freshness chip. No banner. The page never has to admit a sync issue because the displayed value isn't sensitive to one.
              </Callout>
              <Callout>
                <b>What we lose.</b> The "did I hit my steps today?" moment. Power users who came for that signal will need to find it elsewhere — the standalone Trackers screen, the partner app, or a dedicated "Today" detail view.
              </Callout>
              <Callout>
                <b>What still needs handling silently.</b> Total disconnect (auth broken &gt;48h). Even a weekly view can't hide a tracker that hasn't talked to us in days. We'll fall back to a quiet "Reconnect Apple Health" card in that one case — without ever using the word "stale" or "behind".
              </Callout>
            </div>
          </DCArtboard>
        </DCSection>

        {/* ── BASELINE ─────────────────────────────────────── */}
        <DCSection
          id="baseline"
          title="Baseline — “Today”"
          subtitle="What ships now. The implicit promise is dangerous: every value carries the word 'today'.">
          <DCArtboard id="b" label="Baseline · Today" width={400} height={260}>
            <PhoneFrame>
              <Cadence_BaselineDaily/>
            </PhoneFrame>
          </DCArtboard>
        </DCSection>

        {/* ── OPTIONS ───────────────────────────────────────── */}
        <DCSection
          id="options"
          title="Five reframes"
          subtitle="All five remove 'today' from the implicit promise. They differ in how visible the change is and how much utility they preserve.">

          {/* A */}
          <DCArtboard id="a" label="A · This week, totals (Personify-style)" width={400} height={280}>
            <PhoneFrame>
              <Cadence_WeeklyTotals/>
            </PhoneFrame>
          </DCArtboard>
          <DCArtboard id="a-notes" label="A · notes" width={340} height={280}>
            <div style={{ padding: 18, display:'flex', flexDirection:'column', gap: 12, height:'100%', boxSizing:'border-box' }}>
              <Callout>
                <b>What it is.</b> Tiles show running 7-day totals (e.g. 52,840 steps this week, 48h 12m sleep, 5 of 6 active days). Section is labeled <i>"This week"</i> with a Mon–today date range underneath.
              </Callout>
              <Callout>
                <b>Why pick it.</b> Closest to Personify's approach. A 5-hour sync delay is statistically noise inside a weekly total. The numbers feel substantial — bigger numbers feel more durable than smaller ones.
              </Callout>
              <Callout>
                <b>Tradeoff.</b> "Today" is gone. Users who relied on it will need to find it elsewhere.
              </Callout>
            </div>
          </DCArtboard>

          {/* B */}
          <DCArtboard id="b-opt" label="B · 7-day rolling average + sparkline" width={400} height={320}>
            <PhoneFrame>
              <Cadence_RollingAvg/>
            </PhoneFrame>

          <DCArtboard id="b-notes" label="B · notes" width={340} height={320}>
            <div style={{ padding: 18, display:'flex', flexDirection:'column', gap: 12, height:'100%', boxSizing:'border-box' }}>
              <Callout>
                <b>What it is.</b> "Daily steps avg: 8,807 · last 7 days." A sparkline trails the value to show the shape of the week.
              </Callout>
              <Callout>
                <b>Why pick it.</b> Behavioral framing. Average daily steps is a measure of habit, not a daily score. It also handles the "today" question implicitly — today is one point in the trend, not THE point.
              </Callout>
              <Callout>
                <b>Tradeoff.</b> Averages can feel abstract. "8,807" is harder to celebrate than "10,000 — goal hit!". Loses the daily-goal mechanic.
              </Callout>

          <DCArtboard id="c" label="C · Week-at-a-glance bars" width={400} height={300}>
            <PhoneFrame>

              </Callout>
              <Callout>
                <b>Why pick it.</b> Most visual. Communicates the week at a glance and lets the eye see "I had 4 strong days, 2 light days." Today being faded explains itself — users intuit "the day's not done yet" without copy.
              </Callout>
              <Callout>
                <b>Tradeoff.</b> Higher visual density. Bars are small at this width — users may not parse them on first scan.
              </Callout>
            </div>
          </DCArtboard>

          {/* D */}
          <DCArtboard id="d" label="D · “Recent activity” (no time label)" width={400} height={260}>
            <PhoneFrame>
              <Cadence_Recent/>
            </PhoneFrame>
          </DCArtboard>
          <DCArtboard id="d-notes" label="D · notes" width={340} height={260}>
            <div style={{ padding: 18, display:'flex', flexDirection:'column', gap: 12, height:'100%', boxSizing:'border-box' }}>
              <Callout>
                <b>What it is.</b> Drop time framing entirely. "Your activity" + "Recent steps · typical day · 8,807." No window, no implication of currency.
              </Callout>
              <Callout>
                <b>Why pick it.</b> Most defensive. No promise = no broken promise. Numbers are the most-recent-known, period.
              </Callout>
              <Callout>
                <b>Tradeoff.</b> Vague. Users may struggle to act on a number with no time anchor. Likely feels lower-effort than the others.
              </Callout>
            </div>
          </DCArtboard>

          {/* E */}
          <DCArtboard id="e" label="E · Hybrid (today + week)" width={400} height={300}>
            <PhoneFrame>
              <Cadence_TodayWithWeek/>
            </PhoneFrame>
          </DCArtboard>
          <DCArtboard id="e-notes" label="E · notes" width={340} height={300}>
            <div style={{ padding: 18, display:'flex', flexDirection:'column', gap: 12, height:'100%', boxSizing:'border-box' }}>
              <Callout>
                <b>What it is.</b> Each tile shows "Today: 8,572" small, with the weekly figure dominant below. Today is preserved but visually subordinate.
              </Callout>
              <Callout>
                <b>Why pick it.</b> Preserves the "did I hit it today" cue for users who want it, while shifting the dominant number to a stable weekly figure that hides sync gaps.
              </Callout>
              <Callout>
                <b>Tradeoff.</b> Two numbers per tile = visual density doubles. Today's number is still subject to the same sync issue — we just hope users read past it.
              </Callout>
            </div>
          </DCArtboard>

        </DCSection>

        {/* ── RECOMMENDATION ───────────────────────────────── */}
        <DCSection id="rec" title="Recommendation" subtitle="Pick one to ship; pick the next two as the structural backstop.">

          <DCArtboard id="rec" label="Decision" width={580} height={620}>
            <div style={{ padding: 22, height:'100%', boxSizing:'border-box', display:'flex', flexDirection:'column', gap: 14 }}>
              <div className="hero-card">
                <h3>Recommendation</h3>
                <h2>Ship <span style={{color:'#fff'}}>Option A — “This week, totals.”</span> Adopt <span style={{color:'#fff'}}>C's bar treatment</span> in trackers detail, and reserve <span style={{color:'#fff'}}>E's hybrid</span> as a fallback if research shows users miss the daily cue.</h2>
              </div>
              <Callout>
                <b>Why A.</b> It's the most decisive reframe and matches the precedent the user cited (Personify-style). The math works in our favor — partial sync of a few hours disappears inside a weekly total. The numbers feel like accomplishments, not a daily report card.
              </Callout>
              <Callout>
                <b>Header copy matters.</b> Use "This week · Mon Apr 22 — Today" so users know what window the totals cover. Avoid "as of [time]" — that re-introduces the very sync framing we're trying to leave behind.
              </Callout>
              <Callout>
                <b>Don't say 'today' anywhere on this card.</b> Not in tile labels, not in subcopy. The whole point is that today is one input to a weekly truth, not the value being measured.
              </Callout>
              <Callout>
                <b>"Active days: 5 of 6" beats numeric totals where possible.</b> Habit framing dodges the magnitude question entirely. Whether you walked 7,500 or 9,500 steps Tuesday, it counts the same toward "active day."
              </Callout>
              <Callout>
                <b>Compare-to-last-week is the new daily-goal.</b> "↑12% vs last week" gives users a directional signal that's resistant to a single bad sync. Replaces the "did I hit 10k today?" feedback loop.
              </Callout>
            </div>
          </DCArtboard>

          <DCArtboard id="rec-fallback" label="What about total disconnect?" width={400} height={620}>
            <div style={{ padding: 18, display:'flex', flexDirection:'column', gap: 12, height:'100%', boxSizing:'border-box' }}>
              <Callout>
                <b>Hard case: tracker hasn't synced in 48h+.</b> Even a weekly view can't hide this — last week's total drops the longer the gap goes on, and the user notices.
              </Callout>
              <Callout>
                <b>Quiet recovery card.</b> When detected, the section becomes a single low-key row: "Connect Apple Health to see your week" + a button. No "stale" language, no error iconography. Frame it as missing input, not broken state.
              </Callout>
              <Callout>
                <b>Don't trigger this lightly.</b> Threshold should be ≥48h since last successful sync, OR an explicit auth failure from the partner. A normal 4-8h delay should never produce this card.
              </Callout>
              <Callout>
                <b>What never appears in this design.</b> "Stale," "behind," "may not be current," "as of," timestamps, refresh buttons. The whole vocabulary is gone.
              </Callout>
              <Callout>
                <b>Trackers detail screen does the heavy lifting.</b> Users who want today's number get it there, with full transparency about partner sync status — but that's a deliberate "I want the truth" interaction, not the home page.
              </Callout>
            </div>
          </DCArtboard>

          <DCArtboard id="rec-tradeoff" label="What we're giving up" width={400} height={620}>
            <div style={{ padding: 18, display:'flex', flexDirection:'column', gap: 12, height:'100%', boxSizing:'border-box' }}>
              <Callout>
                <b>The daily-goal moment.</b> "I hit 10,000 steps today!" — gone from home. Users can still see it in the partner app and on the trackers detail, but it's no longer the spine of our home page.
              </Callout>
              <Callout>
                <b>Why we're OK losing it.</b> The complaint we received says users currently <i>don't</i> get a satisfying daily-goal moment — they get a number that often feels wrong. A weekly framing trades a broken daily moment for a defensible weekly one.
              </Callout>
              <Callout>
                <b>Real-time use cases.</b> Some programs (e.g. step challenges) prescribe daily targets. Those should render their own progress widget independent of this section, sourced from the program's own data pipeline. Don't mix-mode this card.
              </Callout>
              <Callout>
                <b>Validate.</b> A/B "Today" vs. "This week" against (a) tracker-not-working ticket volume, (b) home → trackers tap-through rate, (c) week-2 retention. We expect (a) to drop, (b) to stay flat, (c) to be neutral or up.
              </Callout>
            </div>
          </DCArtboard>

        </DCSection>

      </DesignCanvas>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

</body>
</html>
