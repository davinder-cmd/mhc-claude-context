  <script>
    function render(tpl, ctx) {
      tpl = tpl.replace(/<!--[\s\S]*?-->/g, '');
      let prev = null;
      while (prev !== tpl) {
        prev = tpl;
        tpl = tpl.replace(/\{\{([#^])([\w.]+)\}\}([\s\S]*?)\{\{\/\2\}\}/g,
          (m, op, key, body) => {
            const v = get(ctx, key);
            const truthy = Array.isArray(v) ? v.length > 0 : !!v;
            if (op === '#') return truthy ? render(body, ctx) : '';
            return truthy ? '' : render(body, ctx);
          });
      }
      tpl = tpl.replace(/\{\{([\w.]+)\}\}/g, (m, key) => {
        const v = get(ctx, key);
        return v == null ? '' : String(v);
      });
      return tpl;
    }
    function get(ctx, path) {
      return path.split('.').reduce((o, k) => (o == null ? o : o[k]), ctx);
    }

      f[`card${n}_metaText`] = '~5 min left';
      f[`card${n}_nextDetail`] = 'Resume to finish';
    }
    function setChallenge(f, n, opts) {
      opts = opts || {};
      clearRails(f, n);
      f[`card${n}_rail_days`] = true;
      f[`card${n}_urgent`] = !!opts.urgent;
      f[`card${n}_daysLeft`] = opts.daysLeft || '12';
      f[`card${n}_daysLeftLabel`] = opts.daysLeftLabel || 'Days left';
      f[`card${n}_title`] = opts.title || 'Spring step challenge';
      f[`card${n}_tagline`] = opts.tagline || 'Challenge · Team Aurora';
      f[`card${n}_stat`] = opts.stat || 'Rank #4 of 38 · 12,400 steps';
    }

      f.hasInProgressPrograms = true; f.hasCard2 = true; f.hasCard3 = true;
      setJourneyPrimary(f, 1);
      setDCP(f, 2);
      setAssessment(f, 3);

      f.hasInProgressPrograms = true; f.hasCard2 = false; f.hasCard3 = false;

    }

      f.hasInProgressPrograms = true; f.hasCard2 = false; f.hasCard3 = false;

    }
    function setAssessmentOnly(f) {
      f.hasInProgressPrograms = true; f.hasCard2 = false; f.hasCard3 = false;
      setAssessment(f, 1);
    }

      f.hasInProgressPrograms = true; f.hasCard2 = true; f.hasCard3 = true;

      setJourneyPrimary(f, 1);

      setChallenge(f, 2, {

      setDCP(f, 3);

      f.habit1_done = true;
      f.habit1_dot1 = 'done'; f.habit1_dot2 = 'done'; f.habit1_dot3 = 'done'; f.habit1_dot4 = 'done'; f.habit1_dot5 = 'done';
      f.habit1_streak = true; f.habit1_streakLabel = '5-day streak';
      // Habit 2 needs logging, no streak
      f.habit2_done = false;
      f.habit2_streak = false; f.habit2_subline = 'Log to start a streak';
      // Habit 3 sensor-tracked
      f.habit3_autoTracked = true; f.habit3_done = false;
      f.habit3_streak = true; f.habit3_streakLabel = '4-day streak';
    }
    function setHabitsOne(f) {
      f.hasHabits = true; f.habits_oneOnly = true;
      f.hasHabit2 = false; f.hasHabit3 = false;
      f.habit1_name = 'Drink water'; f.habit1_target = '3 of 8 today';
      f.habit1_streak = true; f.habit1_streakLabel = '3-day streak';
      f.habit1_done = false; f.habit1_autoTracked = false;
      f.habit1_logLabel = '+ 1 cup';
    }
    function setTeamInvite(f) {
      f.hasPendingInvites = true; f.hasInvite2 = false; f.hasInvite3 = false;
      f.invite1_isTeam = true; f.invite1_isLateJoin = false;
      f.invite1_avatar = 'A';
      f.invite1_name = 'Team Aurora invited you to join';
      f.invite1_detail = 'Spring step challenge · 6 days to join · 3-week activity starts Apr 21';
    }
    function setTeamLateInvite(f) {
      f.hasPendingInvites = true; f.hasInvite2 = false; f.hasInvite3 = false;
      f.invite1_isTeam = true; f.invite1_isLateJoin = true;
      f.invite1_avatar = 'A';
      f.invite1_name = 'Team Aurora invited you to join';
      f.invite1_detail = 'Spring step challenge · 5 days in, 16 days remaining · Aurora is currently #4 of 38';
    }
    function setMixedInvites(f) {
      f.hasPendingInvites = true; f.hasInvite2 = true; f.hasInvite3 = true;
      f.invitesOverflow = false;
      // Team first (closing soonest), then two peer
      f.invite1_isTeam = true; f.invite1_isLateJoin = false;
      f.invite1_avatar = 'A';
      f.invite1_name = 'Team Aurora invited you';
      f.invite1_detail = 'Spring step challenge · 6 days to join';
      f.invite2_isTeam = false;
      f.invite2_avatar = 'JM';
      f.invite2_name = 'Jamie M. challenged you';
      f.invite2_detail = 'Most steps · 5 days · starts when accepted';
      f.invite3_isTeam = false;
      f.invite3_avatar = 'RT';
      f.invite3_name = 'Riley T. challenged you';
      f.invite3_detail = 'Mindful minutes · 7 days';
    }
    function setBannerJoin(f) {
      f.hasChallengeBanner = true; f.challengeBanner_urgent = false;
      f.challengeBanner_text = 'Spring step challenge · 6 days left to join. 240 colleagues already in.';
      f.challengeBanner_ctaLabel = 'Join →';
    }
    function setBannerResults(f) {
      f.hasChallengeBanner = true; f.challengeBanner_urgent = false;
      f.challengeBanner_text = 'Team Aurora finished 3rd · 1.2M steps. Your contribution: 87,400 steps.';
      f.challengeBanner_ctaLabel = 'See results →';
    }

    function dataForState(state) {
      const d = JSON.parse(JSON.stringify(baseData));
      const f = d.formula;
      // reset insights
      f.insightsState_ready = false; f.insightsState_refreshable = false;
      f.insightsState_readOnly = false; f.insightsState_hidden = false;

      switch (state) {
        case 'focused-ready':    f.insightsState_ready = true; break;
        case 'focused-refresh':  f.insightsState_refreshable = true; break;
        case 'focused-readonly': f.insightsState_readOnly = true; break;
        case 'focused-hidden':   f.insightsState_hidden = true; break;
        case 'nofocus-ready':
          f.hasFocus = false;
          f.greeting_name = 'Welcome, Sarah';
          f.greeting_sub = "Let's get started.";
          f.insightsState_ready = true; break;

        case 'progress-typefit':
          f.insightsState_refreshable = true; setTypeFit(f); break;
        case 'progress-journey-focus':
          f.insightsState_refreshable = true; setJourneyFocus(f); break;
        case 'progress-dcp':
          f.insightsState_refreshable = true; setDCPOnly(f); break;
        case 'progress-assessment':
          f.insightsState_refreshable = true; setAssessmentOnly(f); break;
        case 'progress-mixed':
          f.insightsState_refreshable = true; setProgressMixed(f); break;
        case 'progress-overflow':
          f.insightsState_refreshable = true; setOverflow(f); break;
        case 'progress-empty':
          f.insightsState_refreshable = true; break;

        case 'habits-three':
          f.insightsState_refreshable = true; setTypeFit(f); setHabitsThree(f); break;
        case 'habits-mixed':
          f.insightsState_refreshable = true; setTypeFit(f); setHabitsMixed(f); break;
        case 'habits-one':
          f.insightsState_refreshable = true; setTypeFit(f); setHabitsOne(f); break;
        case 'habits-empty':
          f.insightsState_refreshable = true; setTypeFit(f); break;

        case 'challenge-team-invite':
          f.insightsState_refreshable = true; setTeamInvite(f); break;
        case 'challenge-team-late':
          f.insightsState_refreshable = true; setTeamLateInvite(f); break;
        case 'challenge-mixed-invites':
          f.insightsState_refreshable = true; setMixedInvites(f); break;
        case 'challenge-banner-join':
          f.insightsState_refreshable = true; setBannerJoin(f); setTypeFit(f); break;
        case 'challenge-banner-results':
          f.insightsState_refreshable = true; setBannerResults(f); setTypeFit(f); break;
        case 'challenge-everything':
          f.insightsState_refreshable = true;
          setMixedInvites(f); setBannerJoin(f); setProgressMixed(f); break;
      }
      return d;
    }

    async function fetchBlock(name) {
      const r = await fetch(name);
      return await r.text();
    }

    async function paint(host, state) {
      const data = dataForState(state);
      const [b1, b1b, b2b, b2, b2c, b3, b4] = await Promise.all([
        fetchBlock('block-1-greeting-hero.html'),
        fetchBlock('block-1b-invites.html'),
        fetchBlock('block-2b-progress.html'),
        fetchBlock('block-2-today.html'),
        fetchBlock('block-2c-habits.html'),
        fetchBlock('block-3-insights.html'),
        fetchBlock('block-4-foryou.html'),
      ]);
      const action = actionByState[state];
      const actionHTML = action
        ? `<div class="action-btn-host"><button class="mhc-action-btn">${action.icon} ${action.label}</button></div>`
        : '';

      const showInvites = data.formula.hasPendingInvites;
      const showBanner = data.formula.hasChallengeBanner;
      const showB1b = showInvites || showBanner;

      host.innerHTML = `
        <div class="preview-blocklabel">block-1-greeting-hero.html</div>
        ${render(b1, data)}
        <div class="preview-blocklabel">block-1b-invites.html ${showB1b ? '' : '· (suppressed)'}</div>
        ${render(b1b, data)}
        <div class="preview-blocklabel">block-2b-progress.html ${data.formula.hasInProgressPrograms ? '' : '· (suppressed)'}</div>
        ${render(b2b, data)}
        <div class="preview-blocklabel">block-2-today.html · This week (weekly totals)</div>
        ${render(b2, data)}
        <div class="preview-blocklabel">block-2c-habits.html ${data.formula.hasHabits ? '' : '· (suppressed)'}</div>
        ${render(b2c, data)}
        <div class="preview-blocklabel">block-3-insights.html ${data.formula.insightsState_hidden ? '· (hidden)' : ''}</div>
        ${render(b3, data)}
        ${actionHTML}
        <div class="preview-blocklabel">block-4-foryou.html</div>
        ${render(b4, data)}
      `;
    }

    let currentState = 'focused-ready';
    async function repaint() {
      await Promise.all([
        paint(document.getElementById('mobile-host'), currentState),
        paint(document.getElementById('desktop-host'), currentState),
      ]);
    }
    document.querySelectorAll('.preview-toolbar button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.preview-toolbar button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentState = btn.dataset.state;
        repaint();
      });
    });
    repaint();
  </script>
</body>
</html>
