<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Insight banner — render frame</title>
  <link rel="stylesheet" href="mhc-home.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
  <style>.mhc-home{padding:16px}</style>
</head>
<body>
<div class="mhc-home">
  <div class="insight">
    <div class="banner-icon banner-icon--insight">
      <span class="material-symbols-outlined" aria-hidden="true">auto_awesome</span>
    </div>
    <div class="insight__body">
      <div class="eyebrow insight__label"><span class="dot" aria-hidden="true"></span>Insight</div>
      <p class="paragraph-2">Your sleep has improved 12 minutes on average this week — the wind-down routine is paying off. Keep the same bedtime through the weekend.</p>
      <div class="body-3 ink-soft">Next refresh in 4h</div>
    </div>
  </div>
</div>
</body>
</html>
