<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reward cards — render frame</title>
  <link rel="stylesheet" href="mhc-home.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
  <style>.mhc-home{padding:16px}</style>
</head>
<body>
<div class="mhc-home">
  <div class="rewards">

    <div class="reward">
      <span class="reward-chip reward-chip--gift">Gift Card</span>
      <div class="heading-5">$75</div>
      <div class="body-3 reward__meta">Amazon · ready to redeem</div>
      <div class="body-3 reward__sub">$25 to next $25 card</div>
      <a class="reward__link" href="#"><span class="mhc-visually-hidden">Gift card reward</span></a>
    </div>

    <div class="reward">
      <span class="reward-chip reward-chip--points">Points · Silver</span>
      <div class="heading-5">1,250</div>
      <div class="body-3 reward__meta">Silver tier</div>
      <div class="body-3 reward__sub">250 to Gold</div>
      <a class="reward__link" href="#"><span class="mhc-visually-hidden">Points reward</span></a>
    </div>

    <div class="reward">
      <span class="reward-chip reward-chip--raffle">Raffle</span>
      <div class="heading-5">12</div>
      <div class="body-3 reward__meta">Entries this month</div>
      <div class="body-3 reward__sub">Drawing Jul 31</div>
      <a class="reward__link" href="#"><span class="mhc-visually-hidden">Raffle reward</span></a>
    </div>

    <div class="reward">
      <span class="reward-chip reward-chip--store">Store Credit</span>
      <div class="heading-5">$25</div>
      <div class="body-3 reward__meta">Wellness store</div>
      <div class="body-3 reward__sub">Expires in 60 days</div>
      <a class="reward__link" href="#"><span class="mhc-visually-hidden">Store credit reward</span></a>
    </div>

  </div>
</div>
</body>
</html>
