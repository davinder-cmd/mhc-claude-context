<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tracker tiles — variants</title>
  <link rel="stylesheet" href="mhc-home.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
  <style>.mhc-home{padding:16px}</style>
</head>
<body>
<div class="mhc-home">
  <div class="trackers">

    <div class="tracker">
      <div class="tracker__icon"><span class="material-symbols-outlined" aria-hidden="true">directions_walk</span></div>
      <div class="eyebrow tracker__label">Steps</div>
      <div class="heading-6 tracker__value"><span class="arrow material-symbols-outlined" aria-hidden="true">north_east</span>8,432</div>
      <div class="body-3 tracker__meta">Default · green</div>
    </div>

    <div class="tracker tracker--sleep">
      <div class="tracker__icon"><span class="material-symbols-outlined" aria-hidden="true">bedtime</span></div>
      <div class="eyebrow tracker__label">Sleep</div>
      <div class="heading-6 tracker__value"><span class="arrow material-symbols-outlined" aria-hidden="true">north_east</span>6h 43m</div>
      <div class="body-3 tracker__meta">--sleep · blue</div>
    </div>

    <div class="tracker tracker--calories">
      <div class="tracker__icon"><span class="material-symbols-outlined" aria-hidden="true">local_fire_department</span></div>
      <div class="eyebrow tracker__label">Calories</div>
      <div class="heading-6 tracker__value"><span class="arrow material-symbols-outlined" aria-hidden="true">north_east</span>645</div>
      <div class="body-3 tracker__meta">--calories · orange</div>
    </div>

    <div class="tracker tracker--active">
      <div class="tracker__icon"><span class="material-symbols-outlined" aria-hidden="true">timer</span></div>
      <div class="eyebrow tracker__label">Active</div>
      <div class="heading-6 tracker__value"><span class="arrow material-symbols-outlined" aria-hidden="true">north_east</span>42 min</div>
      <div class="body-3 tracker__meta">--active · teal</div>
    </div>

    <div class="tracker">
      <div class="tracker__icon"><span class="material-symbols-outlined" aria-hidden="true">add</span></div>
      <div class="eyebrow tracker__label">Steps</div>
      <div class="body-3 tracker__meta">+ Link steps</div>
    </div>

  </div>
</div>
</body>
</html>
