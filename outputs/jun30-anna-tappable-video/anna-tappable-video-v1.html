<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anna — Tappable Video (v1)</title>
<style>
  :root{
    /* ——— swap points ——— */
    --tile-w: 335px;          /* Figma poster-tile width  */
    --tile-h: 252px;          /* Figma poster-tile height */
    --radius: 16px;
    --ink: #1f2421;           /* near-neutral graphite — not brown */
    --paper: #f4f1ea;         /* warm page background only */
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    display:grid;
    place-items:center;
    background:var(--paper);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
  }

  /* ———————————————————————————————————————————————
     Component: .anna-video
     States are driven by data-state on the root:
       "paused"           → play button + subtext (initial AND after pause)
       "playing-clean"    → video only, no chrome
       "playing-controls" → pause button visible, video still playing
     ——————————————————————————————————————————————— */
  .anna-video{
    position:relative;
    width:var(--tile-w);
    height:var(--tile-h);
    border-radius:var(--radius);
    overflow:hidden;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    background:#000;
    box-shadow:0 1px 2px rgba(31,36,33,.08), 0 8px 24px rgba(31,36,33,.10);
  }
  .anna-video video{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;            /* replicates the Figma FILL center-crop */
    display:block;
  }

  /* Scrims for legibility of chrome over footage */
  .scrim{
    position:absolute; inset:0;
    pointer-events:none;
    opacity:0; transition:opacity .2s ease;
    background:
      radial-gradient(120% 90% at 50% 42%, rgba(0,0,0,.28), rgba(0,0,0,0) 60%),
      linear-gradient(to top, rgba(0,0,0,.42) 0%, rgba(0,0,0,0) 38%);
  }
  .anna-video[data-state="paused"] .scrim,
  .anna-video[data-state="playing-controls"] .scrim{ opacity:1; }

  /* Center transport button (play / pause share the slot) */
  .transport{
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%) scale(.96);
    width:56px; height:56px; border-radius:50%;
    border:0; padding:0; margin:0;
    display:grid; place-items:center;
    background:rgba(255,255,255,.94);
    box-shadow:0 4px 14px rgba(0,0,0,.28);
    cursor:pointer;
    opacity:0; transition:opacity .18s ease, transform .18s ease;
    pointer-events:none;
  }
  .transport svg{ display:block; fill:var(--ink); }
  .play-icon{ margin-left:3px; }       /* optical centering of the triangle */

  .btn-play, .btn-pause{ display:none; }
  .anna-video[data-state="paused"] .btn-play{ display:grid; }
  .anna-video[data-state="playing-controls"] .btn-pause{ display:grid; }
  .anna-video[data-state="paused"] .transport.btn-play,
  .anna-video[data-state="playing-controls"] .transport.btn-pause{
    opacity:1; transform:translate(-50%,-50%) scale(1); pointer-events:auto;
  }

  /* Bottom subtext — shown only in the paused/poster state */
  .subtext{
    position:absolute; left:0; right:0; bottom:0;
    display:flex; align-items:center; gap:7px;
    padding:14px 16px;
    color:#fff;
    font-size:14px; font-weight:600; letter-spacing:.01em;
    opacity:0; transform:translateY(4px);
    transition:opacity .2s ease, transform .2s ease;
    pointer-events:none;
  }
  .anna-video[data-state="paused"] .subtext{ opacity:1; transform:none; }
  .subtext svg{ fill:#fff; flex:0 0 auto; }

  .caption{
    margin-top:18px; text-align:center;
    font-size:12px; color:#8a857c;
  }
</style>
</head>
<body>

  <div class="anna-video" id="annaVideo" data-state="paused"
       role="button" tabindex="0" aria-label="Watch with Anna">

    <video id="annaPlayer" playsinline preload="metadata"
           src="anna-lecture.mp4"></video>

    <div class="scrim"></div>

    <!-- Play (initial + after pause) -->
    <button class="transport btn-play" type="button" aria-label="Play video">
      <svg class="play-icon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8 5v14l11-7z"/>
      </svg>
    </button>

    <!-- Pause (shown after tapping a playing video) -->
    <button class="transport btn-pause" type="button" aria-label="Pause video">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 5h4v14H6zM14 5h4v14h-4z"/>
      </svg>
    </button>

    <!-- Bottom subtext -->
    <div class="subtext">
      <svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      <span>Watch with Anna</span>
    </div>
  </div>

  <p class="caption">Tap to play · tap the video to reveal pause · pause resumes from the same point</p>

<script>
(function(){
  var root   = document.getElementById('annaVideo');
  var video  = document.getElementById('annaPlayer');
  var playBtn  = root.querySelector('.btn-play');
  var pauseBtn = root.querySelector('.btn-pause');

  function setState(s){ root.dataset.state = s; }

  // State 1 → 2 : start (or resume from current position) and hide chrome
  function play(){
    video.play();
    setState('playing-clean');
  }

  // State 4 : pause in place — currentTime is preserved, so play() resumes here
  function pause(){
    video.pause();
    setState('paused');
  }

  // Tap behaviour on the video surface
  root.addEventListener('click', function(e){
    var state = root.dataset.state;
    if (e.target.closest('.btn-pause')) { pause(); return; }      // pause button → stop in place
    if (e.target.closest('.btn-play'))  { play();  return; }      // play button  → play/resume
    if (state === 'paused')           { play(); }                 // tap poster anywhere → play
    else if (state === 'playing-clean'){ setState('playing-controls'); } // State 2 → 3 : reveal pause
    else if (state === 'playing-controls'){ setState('playing-clean'); } // tap away → hide pause (still playing)
  });

  // Keyboard parity
  root.addEventListener('keydown', function(e){
    if (e.key === ' ' || e.key === 'Enter'){
      e.preventDefault();
      (root.dataset.state === 'paused') ? play() : pause();
    }
  });

  // Reaching the end → reset so the next play starts cleanly
  video.addEventListener('ended', function(){
    video.currentTime = 0;
    setState('paused');
  });
})();
</script>
</body>
</html>
